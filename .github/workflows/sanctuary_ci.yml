name: Sanctuary CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify_ataraxia:
    runs-on: ubuntu-latest
    # [修正 2026-10 §BQ] 本ジョブが失敗した際、原因の詳細(pytestの具体的な
    # 失敗箇所・トレースバック)を取得する手段がなかった。「Execute Sanctuary
    # Verification」ステップの生ログは、GitHub Actions内部の一時blobストレージ
    # ホスト(results-receiver.actions.githubusercontent.com等)にのみ保存され、
    # このリポジトリを操作している実行環境のアウトバウンドプロキシの許可リスト
    # にそのホストが含まれていないため、`gh run view --log`等のあらゆる手段で
    # 「Forbidden」になり、取得不可能だった(実機で確認: §BQ参照)。
    # 失敗の事実(exit code 1)は分かっても、原因が一切分からない状態では、
    # 本リポジトリの核心である「自己検証・正直な自白」ができない。
    # そのため、失敗時のみpytestの出力をコミットコメントとして投稿する
    # (GitHub REST APIのcommits/{sha}/commentsは上記のblobストレージホストとは
    # 別の通常のAPIホストであり、同じ制約を受けない)。これには
    # commits/{sha}/comments へのPOSTが必要なため、デフォルトのリポジトリ設定
    # に依存せず、本ワークフロー自身で明示的に contents: write を宣言する。
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      # [修正 2026-10] 以前は依存パッケージを `pip install pytest rsa` として
      # ここに直接ハードコードしており、requirements.txtとの間でズレが発生
      # していた(実機で発見: requests がテストスイートの一部で必要になった
      # 際、ここへの追記が漏れ、tartarus/armageddon.py の `import requests`
      # が原因で創造主ゲートのテストが ModuleNotFoundError でクラッシュして
      # いた)。requirements.txt を単一の正として読み込むことで、このズレを
      # 構造的に防ぐ。
      #
      # [再発 2026-10 §AP] 上記の教訓があったにもかかわらず、その後
      # tests/配下に PyYAML(yaml)・openpyxl を必要とするテストを追加した際、
      # requirements.txt への追記が再び漏れた。これは
      # `.github/workflows/anjo_da_maquina_protocol.yml`(別のワークフロー)
      # 側で `pip install ... pyyaml ... openpyxl ...` が既に行われていた
      # ため、そちらで動作確認したテストがこのワークフローでも通ると誤って
      # 前提してしまったことが原因である。本ワークフローは
      # requirements.txtのみを単一の正として使うため、他のワークフローの
      # インストール内容はここには一切反映されない。GRIMOIRE.md §AP参照。
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Execute Sanctuary Verification
      id: sanctuary_verify
      # [修正 2026-10 §BQ] continue-on-error: true により、このステップ単体の
      # 失敗でジョブを即時終了させず、次の「失敗詳細の投稿」ステップを必ず
      # 実行させる。ジョブ全体の成否は、次のステップの最後でoutcomeに応じて
      # 明示的にexitすることで、元の(本来あるべき)挙動と完全に一致させる。
      continue-on-error: true
      run: |
        # クラウド上(未承認環境)で防壁が正しく発動し、遮断されるかを検証
        set -o pipefail
        pytest tests/ -v -s 2>&1 | tee /tmp/sanctuary_pytest_output.txt

    - name: 失敗時の詳細をコミットコメントとして可視化 (§BQ・ログblobホスト到達不能対策)
      if: steps.sanctuary_verify.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # GitHub側のコメント本文サイズ上限(65536文字)を超えないよう、
        # 末尾(最も重要な失敗メッセージ・トレースバックが集中する部分)を
        # 優先して60000バイトに切り詰める。
        tail -c 60000 /tmp/sanctuary_pytest_output.txt > /tmp/sanctuary_pytest_tail.txt
        {
          echo "### 🔥 Sanctuary CI/CD (\`verify_ataraxia\`) — pytest failure"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo '```'
          cat /tmp/sanctuary_pytest_tail.txt
          echo '```'
        } > /tmp/sanctuary_pytest_comment_body.md
        # [実装中の自己訂正(自白) §BQ] 当初 `-f body=@...` と書いていたが、
        # `gh api`の`@<path>`ファイル読み込み構文は`-F/--field`専用であり、
        # `-f/--raw-field`では文字列"@/tmp/..."がそのまま送信されてしまう
        # (= コメント本文がファイルの内容ではなく、ファイルパスの文字列その
        # ものになる)ことを、実機で実際にこの誤った投稿が行われたのを見て
        # 発見した。本来確認すべきこと(「診断用に追加した仕組み自体が実際に
        # 正しく動くか」)を怠っていたこと自体が、§BPで一般化した「有効側の
        # 分岐を実際に踏んで確認する」という教訓への違反であり、素直に認める。
        gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
          -F body=@/tmp/sanctuary_pytest_comment_body.md
        # ジョブ自体は、元の(continue-on-errorが無かった場合と同じ)結果である
        # 「失敗」として正しく報告する。
        exit 1
