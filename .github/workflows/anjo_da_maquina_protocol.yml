        # (個々のイベント名列挙ではなく名前空間ごとの広いdefault-deny
        # 方式を採用しているため)この欠陥の対象ではなく、一切の変更を
        # 加えていない。この非対称性は§CAの教訓と同種のものである。
        #
        # [正直な注記: 本検査の限界] Sanctumに入る『前』に関数ポインタ
        # 自体を解決・変数に保存しておけば、その後の呼び出し自体は
        # 新たなaudit eventを一切発生させないため(実機で確認済み)、
        # 本修正・本天使のいずれもこれには及ばない。これは本防御方式
        # (audit hookベースの検査)自体の限界であり、恒久対策には
        # OSレベルのサンドボックスが必要である。
        if: success()
        run: python angels/chamuel_dlsym_guard.py
      - name: 22.87. ヌリエルの剥奪 (Nuriel's Stripping - サンダルフォン隔離結界のLinuxケーパビリティ・特権昇格の恒久的剥奪)
        # [新設 2026-10 §CF] §CD・§CEで繰り返し正直に記録してきた通り、
        # Python層のaudit hook(sefer/maquina_gatekeeper)には構造的な
        # 限界がある――Sanctumに入る『前』に確保済みのfdや関数ポインタ
        # を使った操作は、以後いかなる新たな監査イベントも発生させずに
        # 素通りする。これは「城内に関所を増やす」方式そのものの限界で
        # あり、恒久対策には「城を囲む外壁」すなわちOSレベル(カーネル
        # レベル)の強制が必要であると記してきた。本件はユーザーからその
        # 恒久対策への着手を依頼され、既存のOSレベル隔離結界
        # (`src/sandalphon_jail.py`のSandalphon、Dockerコンテナ内での
        # 動的実行検証)を調査した結果の修正である。
        #
        # 実際のdocker run呼び出しを確認したところ、ネットワーク完全
        # 遮断・読み取り専用・非rootユーザーの3点にしか依存しておらず、
        # コンテナ自体にはDockerの既定のLinuxケーパビリティ集合
        # (CAP_DAC_OVERRIDE・CAP_SETUID等、ファイル権限チェックの迂回や
        # uid/gid変更を可能にする)がそのまま残っていた。使い捨てスク
        # リプト実行にこれらの正当な必要性は無いため、`--cap-drop=ALL`・
        # `--security-opt=no-new-privileges`・`--pids-limit`を追加した。
        #
        # [正直な注記] この検査環境(クラウドサンドボックス)はコンテナ
        # レジストリへの出口ネットワークが許可一覧で遮断されており、
        # `python:3.11-alpine`イメージの取得自体が実機で403 Forbiddenと
        # なることを確認済みである。そのため本天使は、この環境では常に
        # 実行できる静的検証(3オプションの存在確認)のみをPASS/FAILで
        # 判定し、実際にコンテナを起動してケーパビリティ剥奪がカーネル
        # によって本当に強制されているかの動的検証は、INCONCLUSIVE(PASS
        # への偽装なし)として正直に報告する。インターネットに到達できる
        # 実際のGitHub Actions環境でこの動的検証が実際にPASSすることを
        # 継続的に確認する。
        if: success()
        run: python angels/nuriel_capability_strip_guard.py
      - name: 22.88. ドミニオンの統治 (Dominions' Dominion - seccompによるシステムコール次元のカーネルレベル支配の検知)
        # [新設 2026-10 §CG] §CFのLinuxケーパビリティ剥奪は「root相当の
        # 特権の有無」を制御するが、「どのシステムコール自体を呼べるか」
        # は制御しない――§CD・§CEで発見した「Sanctumに入る前に確保済みの
        # fd・関数ポインタを使った迂回」は、特権を一切必要とせず、無権限
        # プロセスのままでも到達できるシステムコールの範疇にある。
        #
        # `src/sandalphon/seccomp-profile.json`(denylist方式のseccomp
        # プロファイル)を新設し、`run_in_sandalphon()`の`docker run`へ
        # `--security-opt=seccomp=...`で適用した。プロセス生成・ptrace・
        # mount・カーネルモジュール・特権関連・生ソケット(--network none
        # の上の多層防御)・時刻変更・NUMA/keyringといった、危険だが
        # 良性のスクリプト実行には一切不要なシステムコール群を、カーネル
        # レベルで直接ERRNO拒否する。
        #
        # [正直な設計開示] defaultActionはSCMP_ACT_ALLOW(denylist方式)
        # である。§CFと同じ制約(この調査環境のネットワーク許可一覧が
        # コンテナレジストリへの到達を遮断しており、`python:3.11-alpine`
        # イメージを実際に取得・straceして真に必要な許可リストを網羅的に
        # 洗い出せない)により、真のdefault-deny(allowlist)方式は、
        # 正しく構成できたことを実機確認できる環境でのみ着手すべき、
        # 正直な未着手の課題として残した。
        #
        # 本天使は3段階で検証する: (A) プロファイルJSON自体の静的健全性、
        # (B) `run_in_sandalphon()`が実際にこのプロファイルを参照して
        # いるかの静的確認、(C) Dockerを一切使わず、libseccomp(C ABI)
        # への直接ctypes呼び出しで、同じdenylistをこの実機のカーネルへ
        # 直接ロードし、denylist上の各システムコールが本当にEPERMで
        # 拒否され、良性の操作(getpid・ファイルの読み書き)は引き続き
        # 成功することを、対照実験付きで実機確認する。(C)はDockerデーモン
        # ・コンテナレジストリのいずれにも依存しないため、§CFと異なり
        # この調査環境でも常にPASS/FAILを判定できる(確認済み)。(D)として
        # 実際のDockerコンテナ内での動作も試みるが、この環境ではこれまで
        # 通りイメージ取得に失敗するため、ここのみ§CFと同様に
        # INCONCLUSIVEとなる。
        #
        # [実装中に自分で発見・即時訂正した誤り(正直な自己開示)] 本天使
        # 自身の回帰テスト(denylistがforkを塞いでいない架空のプロファイル
        # を与えてFAIL検知を確認する試験)が、生カーネル検証ハーネス内の
        # 本物のバグを検出した――fork()が実際に成功する経路で、子プロセス
        # が親と同じコードを実行し続け、`subprocess.run(capture_output=
        # True)`が開いたパイプの書き込み端を複製したまま保持するため、
        # 親(呼び出し元)がEOFを検知できずTimeoutExpiredに陥っていた。
        # 子プロセスを直ちに`os._exit()`で終了させ、親が`os.waitpid()`
        # で待つよう修正した(GRIMOIRE.md §CG参照)。
        if: success()
        run: python angels/dominions_syscall_guard.py

      - name: 22.89. ハドラニエルの門 (Hadraniel's Gate - socket.send/sendallの事前接続バイパス検知)
        # [新設 2026-10 §CO] §CNの調査直後、同じ「audit eventが存在しない
        # API」という観点を通信系APIに広げて再確認したところ、
        # `socket.socket.send()`/`sendall()`が、実機で確認した限り一度も
        # audit eventを発火しないことが判明した。`angels/
        # jegudiel_exfiltration_guard.py`の§CA時点のコメントは「必ず
        # 事前のconnectを要するため検査不要」と判断していたが、これは
        # §CB・§CD・§CNで繰り返し発見している「Sanctum起動前に確保した
        # fd・接続は起動後も検査を素通りする」という前提openedバイパスの
        # 構造を見落としていた。実機で、Sanctum起動前に実TCP接続を確立し、
        # 起動後に`.send()`で実際のデータを送出する完全な攻撃チェーンが、
        # 無条件に成功し受信側に実際にデータが届くことを確認した。
        #
        # `sefer/__init__.py`に`_guarded_socket_send`/
        # `_guarded_socket_sendall`を新設し、`getpeername()`で接続先
        # ホストを解決して`allowed_hosts`と照合する選別的な許可(§CNの
        # os.sendfileとは異なり、無条件拒否ではなく既存の
        # `_michael_absolute_defense`と同じ方針)で修正した。調査中、
        # "socket.__new__"が`ALWAYS_PASSTHROUGH_AUDIT_EVENTS`に含まれて
        # おらず、`allowed_hosts`を指定していてもソケット生成自体が常に
        # 無条件拒否される別の誤検知(fail-closed方向、セキュリティ
        # ホールではない)も発見・修正した(GRIMOIRE.md §CO参照)。
        if: success()
        run: python angels/hadraniel_socket_send_guard.py

