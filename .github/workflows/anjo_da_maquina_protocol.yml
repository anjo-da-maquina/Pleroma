      - name: 22.85. サキエルの水脈 (Sachiel's Waterway - os.sendfile/os.copy_file_rangeによるカーネル直接転送迂回検知)
        # [新設 2026-10 §CD] sefer/__init__.pyのfd事前オープンバイパス
        # 対策(os.write/os.pwrite/os.writev/os.pwritev の4系統のみを
