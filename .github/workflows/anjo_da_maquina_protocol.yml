name: Anjo da máquina Protocol - Angels

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      chaos_mode:
        description: 'カオスモード（生存証明の途絶・システム異常のシミュレーション）を有効にする'
        required: false
        default: false
        type: boolean

jobs:
  angelic-audit:
    name: 聖なる統合監査 (Angelic Zero-Trust Audit)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 聖域の準備 (Checkout Repository)
        uses: actions/checkout@v3

      - name: 2. 祭壇の準備 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 2.5. 天使の記憶 (Angel State Cache - 実行間の検査状態を永続化)
        # [脆弱性修正 2026-10 §AN] angels/sandalphon_anchor.py・
        # angels/metatron_commitment.py は sefer/.angel_state/ 配下に
        # 「前回実行時のチェックポイント」を保存し、次回実行時にそれと比較する
        # ことで監査証跡のロールバック・改ざんを検知する設計になっている。
        # しかし本ワークフローには actions/cache (または他の永続化手段)が
        # 一度も存在せず、.angel_state/ は .gitignore 対象でもあるため、
        # GitHub Actionsの使い捨てランナー上ではチェックアウト直後は毎回
        # 必ず空になっていた。結果として sandalphon_anchor.py の
        # `if checkpoint:` 分岐(改ざん検知の本体)はCI上で一度も実行された
        # ことがなく、名乗っている役割(証跡のブロックチェーン刻印・改ざん
        # 検知)を一切果たせていない「無人の検問所」状態だった(実機検証済み:
        # 本ワークフローにactions/cache・actions/upload-artifact・
        # actions/download-artifactのいずれも一件も存在しないことを確認)。
        # これはGRIMOIRE.md §AHで修正したZKAuditTrail(プロセスグローバルが
        # 毎回リセットされ検知が発火しない)と同種の「検知ロジック自体は
        # 正しいが、前提とする状態が実行環境で一度も満たされない」という
        # 構造的な見せかけだった。
        #
        # 本修正では、同じキーで保存し続けると(完全一致時はcacheの保存
        # 自体がスキップされ更新されなくなる)actions/cacheの既定挙動により
        # チェックポイントが更新されなくなるため、保存キーに
        # `github.run_id`(実行ごとに一意)を用いて必ず保存を発生させ、
        # 復元時は固定プレフィックスの restore-keys で「直前の最新の
        # チェックポイント」を取得する(GitHub Actions公式が推奨する
        # 「更新され続けるキャッシュ」の標準パターン)。
        #
        # [残存する限界] actions/cache にも7日間アクセスが無いと自動失効する
        # 等の制約があり、恒久不変の外部監査サービスの代替にはならない
        # (sefer/audit_chain.py の鍵管理と同種の、誠実に明記すべき限界)。
        # それでも「CI上では構造的に一度も発火しない」状態から
        # 「通常の実行頻度では実際に機能する」状態への改善である。
        #
        # [脆弱性修正 2026-10 §BF] 上記の§AN修正自体に、新たな誤検知バグが
        # あった。原因は2段階ある。
        #
        # (1) sefer/.angel_state(チェックポイント)はキャッシュされる
        # ようになったが、そのチェックポイントのハッシュの計算に使われた
        # 署名鍵(sefer/audit_chain.pyのSignedAuditChainが使う
        # sefer/.audit_signing_key)は、このキャッシュ対象パスに含まれて
        # いなかった。この鍵は.angel_stateと兄弟ディレクトリの
        # sefer/直下にあり、無ければ実行ごとにos.urandom(32)で新規生成
        # される。
        #
        # (2) 鍵をキャッシュに追加しても、これだけではまだ不十分だった
        # (実機検証で発覚)。sefer/audit_chain.jsonl自体もキャッシュされて
        # おらず、使い捨てランナー上では実行ごとに空のチェーンから作り直さ
        # れる。しかも各エントリのハッシュ計算対象には`timestamp`
        # (record()呼び出し時の実時刻)が含まれるため、鍵が同一であっても、
        # 別の実行で作り直されたチェーンの同じindex位置のエントリは、
        # タイムスタンプが異なるために必ず別のハッシュになる。つまり
        # 「前回実行のチェックポイント」と「今回ゼロから作り直したチェーン」
        # を比較する限り、鍵を揃えるだけでは原理的に一致し得ない。
        #
        # 本質的には、この「証跡のブロックチェーン刻印」機構が意味を持つ
        # ためには、監査証跡そのものが実行を跨いで継続する単一の台帳で
        # なければならない(名前が示す「ブロックチェーン」の実態)。
        # そのため sefer/audit_chain.jsonl 自体もキャッシュ対象に加え、
        # 鍵・チェーン本体・チェックポイントの3つを常に同じキャッシュ世代
        # でセットに保つようにした。実機検証: 一時ディレクトリで3回分の
        # CI実行を模倣するスクリプトで、(1)のみの修正では2回目以降も
        # 必ず失敗し続けること、(1)+(2)の両方を適用すると2回目・3回目
        # 以降も正しくPASSし続けることの両方を確認した。
        #
        # 本修正では、同じキーで保存し続けると(完全一致時はcacheの保存
        # 自体がスキップされ更新されなくなる)actions/cacheの既定挙動により
        # チェックポイントが更新されなくなるため、保存キーに
        # `github.run_id`(実行ごとに一意)を用いて必ず保存を発生させ、
        # 復元時は固定プレフィックスの restore-keys で「直前の最新の
        # チェックポイント」を取得する(GitHub Actions公式が推奨する
        # 「更新され続けるキャッシュ」の標準パターン)。
        #
        # [残存する限界] actions/cache にも7日間アクセスが無いと自動失効する
        # 等の制約があり、恒久不変の外部監査サービスの代替にはならない
        # (sefer/audit_chain.py の鍵管理と同種の、誠実に明記すべき限界)。
        # それでも「CI上では構造的に一度も発火しない」状態から
        # 「通常の実行頻度では実際に機能する」状態への改善である。また、
        # audit_chain.jsonlが実行を跨いで無期限に成長し続ける点は、本来の
        # 「ブロックチェーン」としての意図通りの挙動だが、将来的にはキャッシュ
        # サイズの肥大化に注意が必要である。
        uses: actions/cache@v4
        with:
          path: |
            sefer/.angel_state
            sefer/.audit_signing_key
            sefer/audit_chain.jsonl
          key: angel-state-${{ github.run_id }}
          restore-keys: |
            angel-state-

      - name: 3. 供物の準備 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install networkx pyyaml playwright mcp pandas openpyxl pytest
          playwright install chromium --with-deps

      - name: 3.2. アルファとオメガの結界 (Workflow Integrity Guard)
        run: python angels/alpha_omega_guard.py
      - name: 3.3. ルシファーの叛逆 (Chaos Engineering)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/lucifer_rebellion.py
      - name: 3.4. メタトロンの立方体 (Metatron's Cube - ハードウェア物理署名監査)
        run: python angels/metatron_cube_hsm.py
      - name: 3.5. 穹窿の聖域 (Firmament Enclave - TEEメモリ暗号化監査)
        run: python angels/firmament_enclave_tee.py
      - name: 3.6. シャミールの封印 (Shamir's Seal - 分散鍵管理と鍵復元定足数監査)
        run: python angels/shamir_seal.py
      - name: 3.8. 外部要件の抽出 (Excel to YAML Parser)
        run: python adapters/excel_to_yaml_parser.py

      - name: 4. ウリエルの焰 (Uriel - リプレイ攻撃監査)
        run: python angels/uriel_nonce.py
      - name: 4.5. メタトロンの啓示 (Metatron MCP - 情報統制監査)
        run: python angels/metatron_revelation_mcp.py
      - name: 4.8. 熾天使の合意 (Seraphim Consensus - マルチLLM異端検知)
        run: python angels/seraphim_consensus.py
      - name: 4.9. エノクの神託 (Enochian Oracle - 分散型オラクル真理監査)
        run: python angels/enochian_oracle.py
      - name: 4.10. ラファエルの癒やし (Raphael - ファイルクローズ前の自動修復)
        run: python angels/raphael_remediation.py
      - name: 5. メタトロンの印 (Metatron Seal - 要件改ざん防止)
        run: python angels/metatron_commitment.py
      - name: 6. ミカエルの剣 (Michael - 論理隠蔽監査)
        run: python angels/michael_sword.py
      - name: 7. オファニムの瞳 (Ophanim - 資格継承監査)
        run: python angels/ophanim_eye.py
      - name: 7.5. アザゼルの禁断知識 (Azazel - サプライチェーン既知脆弱性監査)
        # [新設 2026-10] requirements.txtの各依存が、バージョン固定(==)
        # されているだけでなく、その固定された版自体に既知の脆弱性(CVE)が
        # 公表されていないかをpip-audit(PyPI Advisory Database/OSV.dev)
        # で検証する。ophanim_eye.pyの「固定されているか」の検査を補完する。
        # 実機のGitHub Actions CI上で実際に動作確認済み(GRIMOIRE.md §BL
        # 参照): requests==2.32.3に既知の脆弱性(CVE-2024-47081,
        # CVE-2026-25645)が実在することを本物のpip-audit/OSV.devの照会で
        # 検出し、本ワークフローを正しく失敗させることを確認した。
        run: python angels/azazel_dependency_audit.py
      - name: 8. ザドキエルの天球儀 (Zadkiel - 状態遷移監査)
        run: python angels/zadkiel_astrolabe.py
      - name: 8.5. ザドキエルの勅令 (Zadkiel Shield Decree - 外部脅威取り込みの退行監査)
        # [脆弱性修正 2026-10 §BC] angels/metatron_scripture_seal.pyと同じ
        # 「配線漏れ」が本ファイルにも存在していた。ロジック自体は正しく
        # (shield_rules_pendingの人間承認キュー・APIキー即時消去・完全修飾
        # 名照合を静的検証する)、実機でも単独実行すればPASSするが、どの
        # ワークフローのrun:ステップからも一度も呼び出されていなかった
        # (grep -rl zadkiel_shield_decree でこのファイル以外に一件もヒット
        # しないことを確認済み)。
        run: python angels/zadkiel_shield_decree.py
      - name: 9. カマエルの盾 (Camael - ペイロード防御監査)
        run: python angels/camael_shield.py
      - name: 10. ジョフィエルの鏡 (Jophiel - 意味論的ドリフト監査)
        run: python angels/jophiel_semantic.py
      - name: 11. ガブリエルの囮 (Gabriel - 機密漏洩監査)
        run: python angels/gabriel_canary.py
      - name: 12. ラグエルの天秤 (Raguel - 物理空間監査)
        run: python angels/raguel_scale.py
      - name: 12.5. ラグエルの鑑定 (Raguel's Template Audit - 拡張テンプレート防壁統合監査)
        # [脆弱性修正 2026-10 §BC] 同種の配線漏れ。src/openai_agent_loop.py
        # (拡張用テンプレート)がSanctum/AegisSystemの実防壁統合を保った
        # ままであることを検証するスクリプトが、CIワークフローに一度も
        # 追加されていなかった。
        run: python angels/raguel_template.py
      - name: 13. ラジエルの書 (Raziel - スマートコントラクト鑑定)
        run: python angels/raziel_auditor.py
      - name: 14. サリエルの裏切り (Sariel - 外部ツール偽装監査)
        run: python angels/sariel_fallen_auditor.py
      - name: 14.5. メタトロンの経典印章 (Metatron Scripture Seal - 公開配布境界監査)
        # [脆弱性修正 2026-10 §BC] このステップは以前、CIワークフローに一度も
        # 追加されていなかった。angels/metatron_scripture_seal.pyというスクリプト
        # 自体は実在し、「ライセンス証明書機構(maquina_gatekeeper)の公開配布
        # からの分離」をpyproject.toml・MANIFEST.in・sefer/*.pyの静的import解析
        # という3点で検証する正しいロジックを持っていたが、どのワークフロー
        # ファイルのrun:ステップからも一度も呼び出されておらず、COMMANDS.md・
        # README等にも一切言及が無く、GRIMOIRE.mdの解説文の中だけに存在する
        # 「配線されていない天使」だった(実機検証: `grep -rl
        # metatron_scripture_seal`でGRIMOIRE.md以外に一件もヒットしないことを
        # 確認した)。実際のsdistビルドによる内容検査(tools/build_public_scripture.py・
        # tests/test_public_scripture_isolation.py)は別途pytest経由でCI
        # (.github/workflows/sanctuary_ci.yml)に組み込まれているため配布物
        # そのものの安全性は守られていたが、本スクリプトが担う「設定ファイル
        # 自体が将来静かに後退していないか」という、より早期・軽量な静的検証
        # 層が実質無効化されていた。
        run: python angels/metatron_scripture_seal.py
      - name: 15. 聖域 (Sanctuary - デプロイ許可)
        if: success()
        run: echo "すべての静的・暗号論的監査を通過しました。"

      - name: 16. 権天使の試練 (Principalities - 機能要件E2E監査)
        if: success()
        run: python angels/principalities_e2e.py
      - name: 17. 座天使の千里眼 (Thousand Eyes - UI視覚監査)
        if: success()
        run: python angels/ophanim_thousand_eyes.py
      - name: 18. 外部QAツールの実行 (External QA Adapter)
        if: success()
        run: python adapters/external_qa_wrapper.py
      - name: 18.5. 智天使の結界 (Cherubim - eBPFランタイム監査)
        run: python angels/cherubim_ebpf_guard.py
      - name: 19. 力天使の試練 (Virtues - 非機能要件負荷監査)
        if: success()
        run: python angels/virtues_load.py
      - name: 20. サンダルフォンの響 (Sandalphon - 監査証跡監査)
        if: success()
        run: python angels/sandalphon_echo.py
      - name: 20.5. サンダルフォンの勅令 (Sandalphon Decree - Docker強制サンドボックス化の退行監査)
        # [脆弱性修正 2026-10 §BC] 同種の配線漏れ。AegisSystemのDocker隔離
        # 結界(Sandalphon)が、既定でフェイルクローズドな強制のまま実運用
        # ループに統合され続けているかを静的検証するスクリプトが、CI
        # ワークフローに一度も追加されていなかった。
        if: success()
        run: python angels/sandalphon_decree.py
      - name: 21. 大天使の玉璽 (Sanctuary Manifest - 品質保証一覧出力)
        if: success()
        run: python angels/sanctuary_manifest.py
      - name: 21.5. サンダルフォンの錨 (Sandalphon Anchor - 証跡のブロックチェーン刻印)
        if: success()
        run: python angels/sandalphon_anchor.py
      - name: 22. 汎用レポート出力 (JUnit XML Exporter)
        if: success()
        run: python adapters/junit_xml_exporter.py
      - name: 22.5. 天の石版 (The Heavenly Tablets - ZKP生成)
        if: success()
        run: python angels/heavenly_tablets_zkp.py

      - name: 22.8. ゲヘナの虚無 (Gehenna - 観測者へのエントロピー返還)
        if: failure() || cancelled()
        run: python angels/gehenna_void_entropy.py
      - name: 22.9. アズラエルの大鎌 (Azrael - スマートコントラクト消滅)
        if: failure() || cancelled()
        run: python angels/azrael_scythe_slashing.py
      - name: 23.0. 黙示録の七つのラッパ (Seven Trumpets - 不正事案の恒久的公開)
        if: failure() || cancelled()
        run: python angels/seven_trumpets_ledger.py

      - name: 23.5. 最後の審判 (Dies Irae - 連座制キルスイッチ)
        if: failure() || cancelled()
        run: python angels/dies_irae.py
      - name: 24. 静寂の王座 (Throne of Ataraxia - 完全初期化の浄化)
        if: always()
        run: python angels/ataraxia_throne.py
