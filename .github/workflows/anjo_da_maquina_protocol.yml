        # mmap.__new__のように「監査すべきイベントが存在するのに検査
        # していなかった」のではなく、そもそも監査可能なイベント自体が
        # 存在しなかった。Sanctumに入る前に確保した書き込み用fdへ、
        # 別のfdからこの2関数で直接データを転送するだけで、例外を一切
