      - name: 23.5. 最後の審判 (Dies Irae - 連座制キルスイッチ)
        if: failure() || cancelled()
        run: python angels/dies_irae.py
      - name: 24. 静寂の王座 (Throne of Ataraxia - 完全初期化の浄化)
        if: always()
        run: python angels/ataraxia_throne.py

  incident-log-visibility:
    name: 失敗時の詳細をコミットコメントとして可視化 (§CK・anjo_da_maquina_protocol.ymlにもログblobホスト到達不能対策を追加)
    needs: angelic-audit
    if: failure()
    runs-on: ubuntu-22.04
    # [新設・2026-10 §CK] 失敗時にangelic-auditジョブ自身のログを取得し
    # (`actions: read`)、その内容をコミットコメントとして投稿する
    # (`contents: write`)ために、デフォルトのリポジトリ設定に依存せず
    # 本ワークフロー自身で明示的に宣言する(`sanctuary_ci.yml`の§BQと
    # 同じ方針)。
    permissions:
      contents: write
      actions: read
    steps:
      - name: angelic-auditジョブ自身のログを取得し、コミットコメントとして投稿
        # [新設 2026-10 §CK] §BQで`sanctuary_ci.yml`に実装した「失敗時の
        # pytest出力をコミットコメントとして投稿する」仕組みが、この
        # ワークフロー(`anjo_da_maquina_protocol.yml`)には一度も存在して
        # いなかった。§CH・§CJでは、この調査環境自身のネットワーク許可
        # 一覧がログblobストレージホストへの到達を遮断しているため、本
        # ワークフローの失敗原因を自力で一切確認できず、ユーザー本人に
        # 2回、GitHub Actions UI上のログを直接確認してもらう必要が
        # あった。これは単発の障害調査では許容したが、将来も同じ構造で
        # 繰り返し発生することが明らかなため、恒久的な観測性の欠落として
        # 本件で対応する。
        #
        # §BQの仕組みは単一の`pytest`実行の出力だけを対象にしていたが、
        # `angelic-audit`ジョブは80以上の個別ステップから成るため、
        # 「どのステップのどの出力が失敗の核心か」を、ジョブ全体のログ
        # から自動で切り出す必要がある。そこで、GitHub Actionsのジョブ
        # ログ取得API(`GET /repos/{owner}/{repo}/actions/jobs/{job_id}
        # /logs`)を、このワークフロー自身の実行環境(GitHub Actionsの
        # ランナー自体)から呼び出す。このAPIは実体としてはログblob
        # ストレージへのリダイレクトだが、これを呼ぶのはこのサンド
        # ボックス(制限されたプロキシ経由)ではなく、GitHub Actionsの
        # ランナー自身(通常のインターネット到達性を持つ)であるため、
        # §BQ・§CH・§CJで繰り返し遭遇した到達不能の制約を受けない。
        #
        # [実装中に自分で発見・即時訂正した誤り(正直な自己開示)] 当初、
        # この処理を`angelic-audit`ジョブ自身の最終ステップとして実装
        # し、実際に意図的な失敗を注入して実機で検証したところ、
        # 「ジョブログの取得自体に失敗しました」というエラーで本処理
        # そのものが機能していないことを実機で発見した。原因は、実行中
        # (未完了)の自分自身のジョブに対して、GitHub Actionsのジョブ
        # ログ取得APIを呼び出していたことだった――このAPIは、ジョブが
        # 完全に終了してログが確定した後でなければ、完全なログを返せ
        # ない(自分自身が走っている最中に、自分自身の確定したログを
        # 取得することはできない、という論理的に当然の制約である)。
        # そのため、本処理を`angelic-audit`に`needs:`で依存する別個の
        # ジョブへ分離した。このジョブが開始される時点で`angelic-audit`
        # ジョブは既に完全に終了しており、そのログはAPIから正しく取得
        # できる。
        #
        # [実機で再度発見した誤り・2回目(正直な自己開示)] ジョブ分離後、
        # 実際に意図的な失敗を注入して再検証したところ、分離した
        # `incident-log-visibility`ジョブ自身がconclusion=failureで終了し、
        # しかもコミットコメントが1件も投稿されていなかった(件数0)。
        # このサンドボックスはログblobストレージホストに到達できないため、
        # 「このジョブ自身がなぜ落ちたか」を実機ログから直接読むことは
        # できなかったが、ステップ単位の実行結果(GitHub Checks API)を
        # 確認したところ、自分で書いたスクリプトのステップそのものが
        # conclusion=failureで終わっていた(自分で書いた`exit 0`に到達
        # する前に落ちていたことになる)。
        #
        # ここでGitHub Actionsの仕様を思い出した: `run:`ステップはLinux
        # 上ではデフォルトで`bash --noprofile --norc -eo pipefail {0}`
        # として実行される――つまり`set -e`(errexit)が最初から有効に
        # なっている。自分が書いていた`gh api .../logs > file 2> file2;
        # GH_API_EXIT=$?`や`post_comment ...; POST_EXIT=$?`は、「コマンド
        # を実行してからその終了コードを自分で判定して分岐する」つもりの
        # コードだったが、`set -e`下では、if/while/&&/||の条件式に置かれて
        # いない単純なコマンドが非ゼロで終了した瞬間、シェル自体が即座に
        # 終了する。つまり`GH_API_EXIT=$?`や`POST_EXIT=$?`の行に到達する
        # 前に、`gh api`呼び出しが失敗しただけでスクリプト全体が無言で
        # 落ちていた――「失敗を捕まえて優雅に処理する」ための自分のロジ
        # ックが、その前提条件(シェルがコマンドの失敗で即死しないこと)
        # を満たさないまま書かれていたため、一度も実行されていなかった。
        # これが2回続けて「手がかりゼロの沈黙した失敗」を引き起こした
        # 根本原因である。
        #
        # 対応として、スクリプトの先頭で明示的に`set +e`を宣言し、
        # GitHub Actionsのデフォルトのerrexitを無効化した。これにより、
        # 各`gh api`呼び出しの終了コードを、自分が書いた分岐ロジックで
        # 実際に検査・処理できるようになる。さらに保険として、(1)詳細
        # コメントの投稿自体が失敗した場合に備え、その失敗(終了コード・
        # stdout・stderr)だけを本文にした、外部入力を含まない短い
        # フォールバックコメントを必ず別途投稿する、(2)このジョブ自体は
        # 「可視化のための計器」であり、計器の不調が本来のangelic-audit
        # の失敗連座(キルスイッチ等)に影響を与えてはならないため、常に
        # 明示的な`exit 0`で終える――という2つの保険は維持する。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail

          post_comment() {
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -F body=@"$1"
          }

          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name=="聖なる統合監査 (Angelic Zero-Trust Audit)") | .id' \
            2> /tmp/anjo_jobid_stderr.txt | head -n1)
          JOBID_LOOKUP_EXIT=$?
          if [ -z "$JOB_ID" ]; then
            {
              echo "[警告] angelic-auditのjob_idを特定できませんでした(exit=${JOBID_LOOKUP_EXIT})。"
              echo "--- stderr ---"
              cat /tmp/anjo_jobid_stderr.txt
            } > /tmp/anjo_job_log.txt
          else
            # [実機で3回目に発見した誤り(正直な自己開示)] `set +e`の修正後、
            # ついに本処理のエラーハンドリングが実際に実行され、実機の
            # コミットコメントとして初めて具体的な失敗理由が得られた:
            # 「the response contains terminal escape sequences; pass
            # --allow-escape-sequences to output it anyway」。`gh api`が
            # ジョブログ(pytestの色付き出力などANSIエスケープシーケンスを
            # 含む)を端末への誤表示から保護するため、意図的に出力を拒否する
            # 安全機構だった。しかし`gh api`サブコマンドにはこのフラグが
            # 存在しない(`--allow-escape-sequences`は`gh run view`側の
            # フラグであり、`gh api --help`には現れない)。そこで`gh api`を
            # 使わず、同じエンドポイントをGH_TOKENを使って直接`curl`で呼ぶ
            # ことにした。`curl`は応答バイト列をそのままファイルへ書き出す
            # だけで、`gh`のような端末エスケープシーケンス保護を一切行わない
            # ため、この問題を構造的に回避できる。
            HTTP_CODE=$(curl -sL -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o /tmp/anjo_job_log.txt \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" \
              2> /tmp/anjo_job_log_stderr.txt)
            CURL_EXIT=$?
            if [ "$CURL_EXIT" -ne 0 ] || [ "${HTTP_CODE:-000}" -ge 400 ] 2>/dev/null; then
              {
                echo "[警告] ジョブログの取得自体に失敗しました(job_id=${JOB_ID}, curl_exit=${CURL_EXIT}, http=${HTTP_CODE})。"
                echo "--- stderr ---"
                cat /tmp/anjo_job_log_stderr.txt
              } > /tmp/anjo_job_log.txt
            fi
          fi

          # GitHub側のコメント本文サイズ上限(65536文字)を超えないよう、
          # 末尾(最も直近の、失敗に直結する出力が集中する部分)を優先して
          # 60000バイトに切り詰める(§BQと同じ方針)。
          tail -c 60000 /tmp/anjo_job_log.txt > /tmp/anjo_job_log_tail.txt
          {
            echo "### 🔥 Anjo da máquina Protocol - Angels (\`angelic-audit\`) — 失敗"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/anjo_job_log_tail.txt
            echo '```'
          } > /tmp/anjo_job_comment_body.md

          post_comment /tmp/anjo_job_comment_body.md > /tmp/anjo_post_stdout.txt 2> /tmp/anjo_post_stderr.txt
          POST_EXIT=$?

          if [ "$POST_EXIT" -ne 0 ]; then
            # [今回追加した保険] 詳細コメント本体の投稿が何らかの理由で
            # 失敗しても、無言で終わらせない。本文が小さく外部由来の
            # ジョブログを含まないフォールバックコメントなら、詳細コメント
            # を落とした同じ理由で一緒に失敗する可能性は低いと判断した。
            {
              echo "### ⚠️ Anjo da máquina Protocol - Angels (\`incident-log-visibility\`) — 詳細コメントの投稿自体に失敗"
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "job_id特定結果: ${JOB_ID:-(特定失敗)}"
              echo
              echo '```'
              echo "post exit=${POST_EXIT}"
              echo "--- stdout ---"
              cat /tmp/anjo_post_stdout.txt
              echo "--- stderr ---"
              cat /tmp/anjo_post_stderr.txt
              echo '```'
            } > /tmp/anjo_fallback_comment_body.md
            post_comment /tmp/anjo_fallback_comment_body.md
          fi

          # このジョブ自体は「可視化のための計器」であり、計器の不調が
          # 本来のangelic-audit失敗の連座(キルスイッチ等)に影響を与えて
          # はならないため、常にexit 0で終える。成功/失敗の実態はコメント
          # 本文そのもので伝える。
          exit 0
