        # 検証済み)。監査イベントが存在しない以上、既存のos.write系
        # 4関数と同じ方針で、`os`モジュールのこの2関数自体をラップする
        # 修正を、継続的に再検証する。[正直な注記] 同じ調査でPython
        # ファイルオブジェクト(io.FileIO/BufferedWriter)の.write()も
        # 同様に監査イベントを発生させず迂回できることを確認したが、
        # CPythonの拡張型のためモンキーパッチ自体が不可能
        # (TypeError: cannot set 'write' attribute of immutable type)
        # であり、これは本防御方式(osモジュール関数のPython層ラップ)
